  </style>
  <rect x=".5" y=".5" width="419" height="149" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle class="dot" cx="392" cy="30" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
